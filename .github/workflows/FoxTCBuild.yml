name: FoxTC Build & Pre-Release

on:
  push:
    branches:
      - foxtc-020-tracktastic
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------
      # Java (ForgeGradle 1.7.10 requires Java 8)
      # ----------------------------
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # ----------------------------
      # Gradle setup
      # ----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # ----------------------------
      # Cache Gradle
      # ----------------------------
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ----------------------------
      # Build
      # ----------------------------
      - name: Gradle Build
        run: ./gradlew build

      # ----------------------------
      # Publish to Maven (THIS is the correct task for FG1.2)
      # ----------------------------
      - name: Upload to Maven (uploadArchives)
        if: github.event_name == 'push'
        run: ./gradlew uploadArchives
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_URL: ${{ secrets.MAVEN_URL }}

      # ----------------------------
      # Extract version
      # ----------------------------
      - name: Extract project version
        id: version
        run: |
          VERSION=$(./gradlew -q properties | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ----------------------------
      # Check if release exists
      # ----------------------------
      - name: Check if release already exists
        id: check_release
        run: |
          git fetch --tags
          if git tag | grep -q "v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------------
      # GitHub Pre-Release
      # ----------------------------
      - name: Create GitHub Pre-Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Fox-Traincraft ${{ steps.version.outputs.version }}
          prerelease: true
          body: |
            Automated release for **Fox Traincraft**

            Branch: `foxtc-020-tracktastic`
            Version: `${{ steps.version.outputs.version }}`
            Commit: `${{ github.sha }}`

            ⚠ **Note:** If this is a pre-release. It is intended for testing and **does not guarantee stability or completeness**.
          files: |
            build/libs/Fox-Traincraft-${{ steps.version.outputs.version }}*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}