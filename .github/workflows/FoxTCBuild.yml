name: FoxTC Build & Pre-Release

on:
  push:
    branches:
      - foxtc-020-tracktastic
  pull_request:

# 🔐 REQUIRED for GitHub Packages uploads
permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------
      # Java 8 (required for 1.7.10 ForgeGradle)
      # ----------------------------
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      # ----------------------------
      # Gradle setup
      # ----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # ----------------------------
      # Cache Gradle
      # ----------------------------
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ----------------------------
      # Build mod
      # ----------------------------
      - name: Gradle Build
        run: ./gradlew build

      # ----------------------------
      # Extract version from Gradle
      # ----------------------------
      - name: Extract project version
        id: version
        run: |
          VERSION=$(./gradlew -q properties | awk -F': ' '/^version:/ {print $2; exit}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ----------------------------
      # Check if package version exists (GitHub Packages)
      # ----------------------------
      - name: Check if package version exists
        id: check_pkg
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GROUP_PATH="com/bidahochi/traincraft"
          ARTIFACT="fox-traincraft"
          REPO="Traincraft-5"

          URL="https://maven.pkg.github.com/bidahochi/${REPO}/$GROUP_PATH/$ARTIFACT/$VERSION/$ARTIFACT-$VERSION.pom"

          echo "Checking $URL"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            $URL)

          echo "HTTP status: $STATUS"

          if [ "$STATUS" != "404" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      # Publish to GitHub Packages (SKIPS if exists)
      # ----------------------------
      - name: Upload to Maven (uploadArchives)
        if: github.event_name == 'push' && steps.check_pkg.outputs.exists == 'false'
        run: ./gradlew uploadArchives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      # ----------------------------
      # log when skipped
      # ----------------------------
      - name: Skip publish notice
        if: steps.check_pkg.outputs.exists == 'true'
        run: echo "Package version already exists — skipping publish."

      # ----------------------------
      # Check if release exists
      # ----------------------------
      - name: Check if release already exists
        id: check_release
        run: |
          git fetch --tags
          if git tag | grep -q "v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ----------------------------
      # GitHub Pre-Release
      # ----------------------------
      - name: Create GitHub Pre-Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Fox-Traincraft ${{ steps.version.outputs.version }}
          prerelease: true
          body: |
            Automated release for **Fox Traincraft**

            Branch: `foxtc-020-tracktastic`
            Version: `${{ steps.version.outputs.version }}`
            Commit: `${{ github.sha }}`

            ⚠ **Note:** If this is a pre-release. It is intended for testing and **does not guarantee stability or completeness**.
          files: |
            build/libs/Fox-Traincraft-${{ steps.version.outputs.version }}*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}